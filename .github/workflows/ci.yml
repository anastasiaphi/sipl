name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Встановлення
        run: pip install -e ".[dev]"

      - name: Перевірка коду (lint)
        run: ruff check .

      - name: Тести
        run: pytest --cov=sipl

      - name: Збірка пакета
        run: python -m build

      - name: Збереження пакета
        uses: actions/upload-artifact@v4
        with:
          name: sipl-package
          path: dist/