[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sipl"
version = "0.1.0"
description = "Інструменти для мови SIPL: парсер, інтерпретатор, семантичні терми"
requires-python = ">=3.10"
dependencies = ["lark>=1.1"]

[project.scripts]
sipl = "sipl.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "build"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sipl = ["*.lark"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]